# The `gate` check the paiml org ruleset requires on main.
# Every job runs on GitHub-hosted ubuntu-24.04 with pinned tool versions.
# `gate` needs every other job.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.7"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: python3 -m pip install -e ".[dev]"
      - run: make lint
      - run: make typecheck

  test:
    name: test (100% coverage)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.7"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - run: python3 -m pip install -e ".[dev]"
      - run: make coverage

  gate:
    name: gate
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    needs: [lint, test]
    steps:
      - name: All jobs must succeed
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
