[project]
name = "databricks-data-science"
version = "0.1.0"
description = "Elo team ranking and MVP scoring on the European Soccer Database, in Python and SQL"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["duckdb>=1.1.0"]

[project.optional-dependencies]
dev = ["ruff==0.14.1", "mypy==1.14.1", "pytest==8.3.4", "pytest-cov==6.0.0"]

[project.scripts]
dbx-ds = "dbx_ds.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_ds"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/dbx_ds"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks import after the cell that sets sys.path.
"notebooks/*" = ["E402"]
